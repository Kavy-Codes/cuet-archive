<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The CUET Archive — Under Maintenance</title>
<meta name="description" content="The CUET Archive is temporarily under maintenance. The full resource library will return soon.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛</text></svg>">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151e;
    --ink: #f2ead6;
    --muted: rgba(242, 234, 214, 0.55);
    --line: rgba(242, 234, 214, 0.14);
    --amber: #e9a13b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(233, 161, 59, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 32px;
  }
  main {
    width: min(560px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: clamp(32px, 6vw, 56px);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  main::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  .mark {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 22px;
    filter: grayscale(0.15);
  }
  h1 {
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 750;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 span { color: var(--amber); }
  p {
    color: var(--muted);
    font-size: 15.5px;
    line-height: 1.65;
    margin-bottom: 10px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-top: 22px;
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
  }
  footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--muted);
  }
  footer a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(242, 234, 214, 0.35);
    transition: border-color 0.2s, color 0.2s;
  }
  footer a:hover { color: var(--amber); border-color: var(--amber); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }
</style>
</head>
<body>
  <main>
    <div class="mark">🏛</div>
    <h1>Under <span>Maintenance</span></h1>
    <p>The CUET Archive is temporarily offline while we work on it.</p>
    <p>The full library of 140+ resources will be back soon — thanks for your patience.</p>
    <div class="status"><span class="dot"></span> Back shortly</div>
    <footer>
      Need resources right now?<br>
      <a href="https://discord.gg/ZM7XNMapD">Join the CUET 2027 Discord →</a>
    </footer>
  </main>
</body>
</html>
